name = "zyrocorp-us-bpo"
main = "worker/index.js"
compatibility_date = "2026-10-30"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "zyrocorp-leads"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
